# Native Windows ARM64 builds keep their own installer and update channel.
# Preserve the existing x64 filenames and latest.yml for installed clients.
extends: ./electron-builder.yml

win:
  target:
    - target: nsis
      arch:
        - arm64
    - target: portable
      arch:
        - arm64

nsis:
  artifactName: TokkipHealthyPC-Setup-${version}-arm64.${ext}

portable:
  artifactName: TokkipHealthyPC-Portable-${version}-arm64.${ext}

publish:
  provider: github
  owner: Andford
  repo: tokkiphealthypc
  releaseType: release
  channel: latest-arm64
