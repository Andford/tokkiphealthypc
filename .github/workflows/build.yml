name: Build - Windows

# Builds Tokkip Healthy PC for Windows (installer and portable) on every push
# and uploads them. A tag v* also publishes a GitHub release, which the app's
# updater reads. Unsigned: Windows SmartScreen will ask the first time.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --win --x64 --publish always
          else
            npx electron-builder --win --x64 --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TokkipHealthyPC-Windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14
