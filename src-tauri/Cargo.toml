[package]
name = "tokkip-healthy"
description = "Tokkip Healthy PC: limpia, cuida y optimiza tu PC con Tokkip"
authors = ["Andy (LoperStack)"]
version = "0.5.0"
edition = "2021"
license = "MIT"

[lib]
name = "tokkip_healthy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sysinfo = { version = "0.33", default-features = false, features = ["disk", "system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
